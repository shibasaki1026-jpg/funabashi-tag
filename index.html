<script>
(function(){
const {useState,useRef,useEffect,useCallback} = React;
const h = React.createElement;

/* ============ MAP ============
   正三角形パネルを敷き詰めた抽象的な盤面。
   1) 格子点を作り、辺の長さSIDEのペアを全部つないだ「三角格子」を作る（パネル描画用）
   2) その格子から、固定シード乱数で「全域木＋余分な辺EXTRA本」を選び、
      葉（行き止まり）をPRUNE回刈って、次数2の点を折れ線にまとめる → 道路網
   船橋駅版（交差点70・道路89・道路平均114px・総延長1.0万px）と同じくらいの分岐数・距離になるよう調整。
   シード固定なので、どの端末でも同じ盤面になる（オンライン版で必須）。
   nodes: id->[x,y] / edges: {a,b,pts[]}（従来と同じ形なので描画・AIロジックは変更不要） */
const W=1024, H=1024, SIDE=90, ROWH=SIDE*Math.sqrt(3)/2, MARGIN=72;
const MAP_SEED=2, MAP_EXTRA=32, MAP_PRUNE=2; // 盤面を変えたいときはここ（SEEDを変えると別の盤面になる）
const GRID={}; const GPTS=[];
for(let r=0,y=MARGIN; y<=H-MARGIN; r++,y+=ROWH){
  const off=(r%2)*(SIDE/2);
  for(let c=0,x=MARGIN+off; x<=W-MARGIN; c++,x+=SIDE){
    const id="n"+r+"_"+c; GRID[id]=[x,y]; GPTS.push({id,x,y});
  }
}
const LATTICE=[]; // 三角格子の全辺 [idA,idB]
for(let i=0;i<GPTS.length;i++)for(let j=i+1;j<GPTS.length;j++){
  const d=Math.hypot(GPTS[i].x-GPTS[j].x,GPTS[i].y-GPTS[j].y);
  if(d>SIDE*0.9&&d<SIDE*1.1) LATTICE.push([GPTS[i].id,GPTS[j].id]);
}
// 隣接3点が互いに全部つながっていれば正三角形パネル1枚（背景用。道路網とは独立）
const TRI=(()=>{const nb={};GPTS.forEach(p=>nb[p.id]=new Set());LATTICE.forEach(([a,b])=>{nb[a].add(b);nb[b].add(a);});
  const out=[];const seen=new Set();
  LATTICE.forEach(([a,b])=>{nb[a].forEach(c=>{ if(c===b||!nb[b].has(c)) return; const ids=[a,b,c].sort(); const key=ids.join("|");
    if(!seen.has(key)){seen.add(key); out.push(ids.map(id=>GRID[id]));} });});
  return out;
})();
function buildRoads(){
  let s=MAP_SEED>>>0; const rnd=()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
  const ids=GPTS.map(p=>p.id);
  const LE=LATTICE.slice(); for(let i=LE.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[LE[i],LE[j]]=[LE[j],LE[i]];}
  const par={}; ids.forEach(k=>par[k]=k); const find=k=>par[k]===k?k:(par[k]=find(par[k]));
  let edges=[],rest=[];
  LE.forEach(e=>{const a=find(e[0]),b=find(e[1]); if(a!==b){par[a]=b;edges.push(e);} else rest.push(e);}); // 全域木
  for(let i=0;i<MAP_EXTRA&&i<rest.length;i++) edges.push(rest[i]); // 余分な辺でループを作る
  let adj={}; const rebuild=()=>{adj={};ids.forEach(k=>adj[k]=[]);edges.forEach(e=>{adj[e[0]].push(e[1]);adj[e[1]].push(e[0]);});};
  rebuild();
  const alive=new Set(ids);
  for(let p=0;p<MAP_PRUNE;p++){ // 行き止まりを刈る
    [...alive].filter(k=>adj[k].filter(x=>alive.has(x)).length<=1).forEach(k=>alive.delete(k));
    edges=edges.filter(e=>alive.has(e[0])&&alive.has(e[1])); rebuild();
  }
  const deg=k=>adj[k].length;
  const nodes={}; [...alive].filter(k=>deg(k)!==2).forEach(k=>nodes[k]=GRID[k]);
  const seen=new Set(); const out=[];
  Object.keys(nodes).forEach(a=>{adj[a].forEach(nb=>{ if(seen.has(a+"|"+nb)) return; let prev=a,cur=nb; const pts=[GRID[a]]; seen.add(a+"|"+nb);
    while(deg(cur)===2&&cur!==a){pts.push(GRID[cur]);const nx=adj[cur][0]===prev?adj[cur][1]:adj[cur][0];seen.add(cur+"|"+nx);seen.add(nx+"|"+cur);prev=cur;cur=nx;}
    pts.push(GRID[cur]); seen.add(cur+"|"+prev); out.push({a,b:cur,pts}); });});
  return {nodes,edges:out};
}
const ROADS=buildRoads();
const NODES=ROADS.nodes;
const EDGES=ROADS.edges.map(e=>{
  const cum=[0]; for(let i=1;i<e.pts.length;i++) cum.push(cum[i-1]+Math.hypot(e.pts[i][0]-e.pts[i-1][0],e.pts[i][1]-e.pts[i-1][1]));
  return {...e,cum,len:cum[cum.length-1]};
});
const ADJ={}; Object.keys(NODES).forEach(k=>ADJ[k]=[]);
EDGES.forEach((e,i)=>{ADJ[e.a].push({e:i,to:e.b});ADJ[e.b].push({e:i,to:e.a});});
function pickStart(){ // 鬼は盤面中央付近、走者2人は対角のコーナー付近から始める
  let oni=null,od=Infinity,r1=null,ad=Infinity,r2=null,bd=-Infinity;
  Object.keys(NODES).forEach(id=>{const [x,y]=NODES[id];
    const dc=Math.hypot(x-W/2,y-H/2); if(dc<od){od=dc;oni=id;}
    const s=x+y; if(s<ad){ad=s;r1=id;} if(s>bd){bd=s;r2=id;}
  });
  return {oni,r1,r2};
}
const START=pickStart();
function pointAt(e,d){ // 距離dの地点（aから測る）
  if(d<=0)return e.pts[0]; if(d>=e.len)return e.pts[e.pts.length-1];
  let i=1; while(e.cum[i]<d)i++;
  const t=(d-e.cum[i-1])/(e.cum[i]-e.cum[i-1]); const p=e.pts[i-1],q=e.pts[i];
  return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
}

function nearestEdge(x,y){ // クリック地点に最も近い道路とその最近点
  let best=null;
  EDGES.forEach((e,i)=>{for(let k=1;k<e.pts.length;k++){const p=e.pts[k-1],q=e.pts[k];const dx=q[0]-p[0],dy=q[1]-p[1];const L2=dx*dx+dy*dy||1;
    let t=((x-p[0])*dx+(y-p[1])*dy)/L2;t=Math.max(0,Math.min(1,t));const px=p[0]+dx*t,py=p[1]+dy*t;const d=Math.hypot(px-x,py-y);
    if(!best||d<best.d)best={e:i,x:px,y:py,d};}});
  return best;
}

/* ============ RULES ============ */
const TOTAL=300, FINAL_REVEAL=30, PING_CYCLE=10, PING_SHOW=2, FREEZE=10, REVEAL=30, BOOST=10, BOOST_MUL=1.5, CHECKPOINT=10, PHASE_SPD=1.1, STEALTH=10, JAM=20, DECOY=60, GUIDE=10, GUIDE_CD=30, PICKUPS=4, PICK_R=16, TOAST=3.8, BASE_SPEED=21 /*px/s（見た目の軽快さ優先）*/, CATCH_R=10, ROUTE_DROP=60;
const PHASES=[{until:60,p:.55},{until:120,p:.66},{until:180,p:.77},{until:240,p:.88},{until:270,p:.94},{until:301,p:1.0}];
function speedMul(n){const base=Math.pow(PHASE_SPD,Math.min(n,4)-1);return n>=PHASES.length?base*1.3:base;} // Lv1〜4で1.1倍ずつ、Lv5は据え置き、MAXは1.3倍
function phaseOf(t){for(let i=0;i<PHASES.length;i++)if(t<PHASES[i].until)return {n:i+1,p:PHASES[i].p};return {n:PHASES.length,p:1};}

function makeAgent(id,node){return {id,node,pe:-1,e:null,to:null,dir:1,s:0,alive:true,freeze:0,stealth:0};}
function posOf(a){
  if(a.e==null) return NODES[a.node];
  const e=EDGES[a.e]; return pointAt(e, a.dir===1?a.s:e.len-a.s);
}
function options(a){ // Uターン禁止（直前に通った道は除外）。行き止まりのみ反転
  const c=ADJ[a.node].filter(o=>o.e!==a.pe);
  return c.length?c:ADJ[a.node].slice();
}
function openOptions(a,blocked,allowUturn){ // 封鎖を考慮した候補。前進できる道が全部封鎖なら、封鎖を突っ切るのではなくUターンする
  const all=ADJ[a.node].filter(o=>!blocked.has(o.e));
  if(!all.length) return ADJ[a.node].slice(); // 全方向封鎖: やむを得ず通す
  if(allowUturn) return all;
  const fwd=all.filter(o=>o.e!==a.pe);
  return fwd.length?fwd:all;
}
function edgeDistAt(e,x,y){ // 道の上の点(x,y)が a端から何pxの位置か
  let best=null;
  for(let i=1;i<e.pts.length;i++){const p=e.pts[i-1],q=e.pts[i];const dx=q[0]-p[0],dy=q[1]-p[1];const L2=dx*dx+dy*dy||1;
    let tt=((x-p[0])*dx+(y-p[1])*dy)/L2;tt=Math.max(0,Math.min(1,tt));const d=Math.hypot(p[0]+dx*tt-x,p[1]+dy*tt-y);
    if(best===null||d<best.d)best={d,s:e.cum[i-1]+Math.hypot(dx,dy)*tt};}
  return best?best.s:0;
}
function turnBackIfBefore(ag,eIdx,x,y){ // その道を進行中で、封鎖点をまだ越えていなければ引き返す
  if(ag.e!==eIdx) return false;
  const e=EDGES[eIdx]; const sA=ag.dir===1?ag.s:e.len-ag.s; const m=edgeDistAt(e,x,y);
  const before=ag.dir===1?sA<m:sA>m;
  if(!before) return false;
  const from=ag.node; ag.node=ag.to; ag.to=from; ag.dir=-ag.dir; ag.s=e.len-ag.s; ag.pe=eIdx; return true;
}
function forceTurnBack(ag,eIdx){ // ルート消失: その道の途中にいれば位置に関わらず即座に引き返す
  if(ag.e!==eIdx) return;
  const e=EDGES[eIdx]; const from=ag.node; ag.node=ag.to; ag.to=from; ag.dir=-ag.dir; ag.s=e.len-ag.s; ag.pe=eIdx;
}
function graphConnected(blocked){ // blockedを除いても全ノードが繋がっているか（幅優先）
  const keys=Object.keys(NODES); if(!keys.length) return true;
  const seen={}; seen[keys[0]]=true; const stack=[keys[0]]; let n=1;
  while(stack.length){ const u=stack.pop();
    ADJ[u].forEach(o=>{ if(blocked.has(o.e)) return; if(!seen[o.to]){seen[o.to]=true;n++;stack.push(o.to);} }); }
  return n===keys.length;
}
function tryDropRoute(g){ // ランダムな1本を、全体の連結を保てる範囲で永久に封鎖する
  const already=new Set(g.dropped);
  const cand=EDGES.map((e,i)=>i).filter(i=>!already.has(i));
  shuffle(cand);
  for(const idx of cand){
    const test=new Set(already); test.add(idx);
    if(graphConnected(test)){
      g.dropped.push(idx);
      [g.oni,...g.runners,...g.dummies].forEach(a=>forceTurnBack(a,idx));
      g.toast={text:"ルート消失",sub:"",t:TOAST};
      return true;
    }
  }
  return false;
}
function runnerChoose(a,oniPos,g){ // 鬼が見えている間だけ、鬼へ最も近づく道を候補から外す。走者の「導き」で封鎖された道・消失したルートは通らない（必要ならUターン）
  const blocked=new Set((g?g.dropped||[]:[]).concat(g?g.guides.filter(x=>x.side==="r").map(x=>x.e):[]));
  let c=blocked.size?openOptions(a,blocked,false):options(a);
  if(oniPos&&c.length>=2){
    let worst=null;
    c.forEach(o=>{const n=NODES[o.to];const d=(n[0]-oniPos[0])**2+(n[1]-oniPos[1])**2;if(worst===null||d<worst.d)worst={o,d};});
    c=c.filter(o=>o!==worst.o);
  }
  return c[Math.floor(Math.random()*c.length)];
}
function distFrom(agent,blocked){ // 走者の現在位置から各交差点までの道なり距離（ダイクストラ）
  const D={}; Object.keys(NODES).forEach(k=>D[k]=Infinity); const done={};
  if(agent.e==null) D[agent.node]=0;
  else { const e=EDGES[agent.e]; const sA=agent.dir===1?agent.s:e.len-agent.s; D[e.a]=Math.min(D[e.a],sA); D[e.b]=Math.min(D[e.b],e.len-sA); }
  for(;;){
    let u=null,ud=Infinity; for(const k in D){ if(!done[k]&&D[k]<ud){ud=D[k];u=k;} }
    if(u===null) break; done[u]=true;
    ADJ[u].forEach(o=>{ if(blocked.has(o.e)) return; const nd=ud+EDGES[o.e].len; if(nd<D[o.to]) D[o.to]=nd; });
  }
  return D;
}
function oniChoose(a,runners,p,g){
  const blocked=new Set(g?g.checkpoints.map(cp=>cp.e).concat(g.guides.filter(x=>x.side==="o").map(x=>x.e)).concat(g.dropped||[]):[]); // 検問 + 鬼自身の「導き」+ 消失ルート
  // 賢さMAX（100%）のときは完全ナビ: Uターンも許可して本当の最短路を選ぶ。封鎖路は通らない（必要ならUターン）
  let c=openOptions(a,blocked,p>=1);
  if(c.length===1)return c[0];
  // 最も道なりで近い走者をターゲットにする（直前のターゲットは2割以内の差なら維持して迷いを防ぐ）
  let D=null,td=Infinity,tid=null;
  runners.forEach(r=>{const d=distFrom(r,blocked);let v=d[a.node];if(g&&g.oniTarget===r.id)v*=0.8;if(v<td){td=v;D=d;tid=r.id;}});
  if(!D) return c[Math.floor(Math.random()*c.length)]; // 誰も見つけられない: 徘徊
  if(g) g.oniTarget=tid;
  let best=null,bd=Infinity;
  c.forEach(o=>{const d=EDGES[o.e].len+(D?D[o.to]:0);if(best===null||d<bd){bd=d;best=o;}});
  if(!isFinite(bd)) return c[Math.floor(Math.random()*c.length)]; // 検問で完全に遮断されている: 徘徊
  if(Math.random()<p) return best;
  const rest=c.filter(o=>o!==best); return rest[Math.floor(Math.random()*rest.length)];
}
function advance(a,dist,chooser){
  let guard=0;
  while(dist>0&&guard++<20){
    if(a.e==null){const o=chooser(a);a.e=o.e;a.to=o.to;a.dir=EDGES[o.e].a===a.node?1:-1;a.s=0;}
    const remain=EDGES[a.e].len-a.s;
    if(dist<remain){a.s+=dist;dist=0;}
    else{dist-=remain;a.pe=a.e;a.node=a.to;a.e=null;}
  }
}

function newGame(){
  return {
    elapsed:0, ping:0, oniVisible:false, running:false, over:null,
    catchFlash:0, beepQueued:false, reveal:0, boost:0, toast:null, phaseN:1,
    oni:makeAgent("oni",START.oni),
    runners:[makeAgent("r1",START.r1),makeAgent("r2",START.r2)],
    skills:{r1f:1,r1v:1,r1w:1,r1s:1,r1c:3,r1d:0,r2f:1,r2v:1,r2w:1,r2s:1,r2c:3,r2d:0,onib:1,oniw:1,onij:1},
    dummies:[], guides:[], guideReady:{r1:0,r2:0,oni:0}, dropped:[], dropCount:0,
    jam:0, checkpoints:[], items:makeItems([START.oni,START.r1,START.r2])
  };
}
const ITEM_KINDS=["c"]; // 走者用: 検問のみ
const ONI_ITEM_KINDS=["b","w"]; // 鬼用: ブースト・ワープ
const ITEM_LABEL={f:"凍結",v:"表示",w:"ワープ",s:"隠密",c:"検問",b:"ブースト",d:"おとり"};
const ITEM_SHORT={f:"凍",v:"視",w:"転",s:"隠",c:"検",b:"速",d:"偽"};
function makeItems(avoid){ // スタート時に道路上（交差点）へスキルをランダムに落とす
  const av=avoid.map(k=>NODES[k]);
  const pool=Object.keys(NODES).filter(k=>av.every(a=>Math.hypot(NODES[k][0]-a[0],NODES[k][1]-a[1])>120));
  const items=[]; const used=new Set();
  const drop=(side,kind)=>{ if(!pool.length) return; let k; do{k=pool[Math.floor(Math.random()*pool.length)];}while(used.has(k)&&used.size<pool.length);
    used.add(k); items.push({side,kind,node:k,x:NODES[k][0],y:NODES[k][1]}); };
  for(let i=0;i<PICKUPS;i++) drop("r",ITEM_KINDS[Math.floor(Math.random()*ITEM_KINDS.length)]);
  drop("r","d"); // おとりは1個だけドロップ
  ONI_ITEM_KINDS.forEach(kind=>drop("o",kind)); // 鬼用はブースト1個・ワープ1個
  return items;
}
function oniShown(g){ // 鬼の位置が全員に見えている条件（ジャミング中は30秒表示も無効）
  const final=g.elapsed>0&&TOTAL-g.elapsed<=FINAL_REVEAL;
  return g.oni.freeze>0||g.catchFlash>0||!!g.over||final||(g.jam<=0&&(g.oniVisible||g.reveal>0));
}

function stepGame(g,dt,cfg){
  if(g.over||!g.running) return;
  g.elapsed+=dt;
  g.ping+=dt; if(g.ping>=PING_CYCLE) g.ping-=PING_CYCLE;
  if(g.jam>0) g.jam=Math.max(0,g.jam-dt);
  let vis=g.ping>=PING_CYCLE-PING_SHOW;
  if(g.jam>0) vis=false;
  if(vis&&!g.oniVisible) g.beepQueued=true;
  g.oniVisible=vis;
  g.checkpoints=g.checkpoints.filter(c=>c.until>g.elapsed);
  g.guides=(g.guides||[]).filter(c=>c.until>g.elapsed);
  const dc=Math.min(Math.floor(g.elapsed/ROUTE_DROP),Math.floor((TOTAL-1)/ROUTE_DROP));
  while((g.dropCount||0)<dc){ g.dropCount=(g.dropCount||0)+1; tryDropRoute(g); }
  if(g.catchFlash>0) g.catchFlash-=dt;
  if(g.reveal>0) g.reveal=Math.max(0,g.reveal-dt);
  if(g.boost>0) g.boost=Math.max(0,g.boost-dt);
  if(g.toast&&(g.toast.t-=dt)<=0) g.toast=null;

  const {p,n:pn}=phaseOf(g.elapsed);
  if(pn>g.phaseN){g.phaseN=pn;const mx=pn===PHASES.length;g.toast={text:"鬼：レベル"+(mx?"MAX":pn),big:mx,sub:"",t:TOAST};}
  const alive=g.runners.filter(r=>r.alive);
  const oniPos=(cfg.evade&&oniShown(g))?posOf(g.oni):null;
  alive.forEach(r=>{
    if(r.stealth>0) r.stealth=Math.max(0,r.stealth-dt);
    if(r.freeze>0){r.freeze=Math.max(0,r.freeze-dt);return;}
    advance(r,BASE_SPEED*dt,a=>runnerChoose(a,oniPos,g));
  });
  // 落ちているスキルを拾う（走者のみ）: 使用回数が+1
  if(g.items.length){
    g.items=g.items.filter(it=>{
      if(it.side==="o") return true; // 鬼用は鬼の移動後に判定
      for(const r of alive){const rp=posOf(r);if(Math.hypot(rp[0]-it.x,rp[1]-it.y)<=PICK_R){
        g.skills[r.id+it.kind]=(g.skills[r.id+it.kind]||0)+1;
        g.toast={text:(r.id==="r1"?"走者1":"走者2")+"が「"+ITEM_LABEL[it.kind]+"」を拾った",sub:"残り "+g.skills[r.id+it.kind]+" 回",t:TOAST,small:true};
        if(it.kind==="c") g.respawn=(g.respawn||0)+1; // 検問は拾われるたびに別の場所へ1個補充
        return false;}}
      return true;});
    while(g.respawn>0){g.respawn--;const avoid=[posOf(g.oni),...alive.map(posOf),...g.items.map(i=>[i.x,i.y])];
      const pool=Object.keys(NODES).filter(k=>avoid.every(a=>Math.hypot(NODES[k][0]-a[0],NODES[k][1]-a[1])>90));
      if(pool.length){const k=pool[Math.floor(Math.random()*pool.length)];g.items.push({side:"r",kind:"c",node:k,x:NODES[k][0],y:NODES[k][1]});}}
  }
  // おとり（1分で消える。走者と同じランダム歩行）
  g.dummies=g.dummies.filter(d=>d.until>g.elapsed);
  g.dummies.forEach(d=>advance(d,BASE_SPEED*dt,a=>runnerChoose(a,oniPos,g)));
  const o=g.oni;
  const targets=alive.filter(r=>r.stealth<=0).concat(g.dummies); // 隠密中の走者は鬼に気づかれない。おとりは本物扱い
  if(o.freeze>0){o.freeze=Math.max(0,o.freeze-dt);}
  else {
    advance(o,BASE_SPEED*cfg.oniSpeed*speedMul(pn)*(g.boost>0?BOOST_MUL:1)*dt,a=>oniChoose(a,targets,p,g));
  }
  const op=posOf(o);
  g.dummies=g.dummies.filter(d=>{const dp=posOf(d);if(Math.hypot(dp[0]-op[0],dp[1]-op[1])<=CATCH_R){g.catchFlash=2;return false;}return true;});
  if(g.items.length){ // 鬼がスキルを拾う
    g.items=g.items.filter(it=>{
      if(it.side!=="o") return true;
      if(Math.hypot(op[0]-it.x,op[1]-it.y)<=PICK_R){
        g.skills["oni"+it.kind]=(g.skills["oni"+it.kind]||0)+1;
        g.toast={text:"鬼が「"+ITEM_LABEL[it.kind]+"」を拾った",sub:"残り "+g.skills["oni"+it.kind]+" 回",t:TOAST,small:true};
        return false;}
      return true;});
  }
  targets.forEach(r=>{
    const rp=posOf(r);
    if(Math.hypot(rp[0]-op[0],rp[1]-op[1])<=CATCH_R){r.alive=false;g.catchFlash=2;}
  });
  const left=g.runners.filter(r=>r.alive).length;
  if(left===0){g.over="ONI";g.running=false;}
  else if(g.elapsed>=TOTAL){g.elapsed=TOTAL;g.over="RUNNERS";g.running=false;}
}

/* ============ AUDIO ============ */
let actx=null;
function beep(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const o=actx.createOscillator(),gn=actx.createGain();
    o.type="square";o.frequency.value=1760;gn.gain.value=0.05;
    o.connect(gn);gn.connect(actx.destination);
    const t=actx.currentTime;o.start(t);o.stop(t+0.04);
  }catch(e){}
}

/* ============ DRAW ============ */
// 背景: 正三角形パネルのモザイクを一度だけオフスクリーンcanvasに焼いておく（毎フレーム塗り直さない）
const bgCanvas=(()=>{
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const bx=c.getContext("2d");
  bx.fillStyle="#F7F7F5"; bx.fillRect(0,0,W,H);
  const palette=["#EFEDE5","#E6E2D6","#F1EFE8"];
  TRI.forEach((pts,i)=>{
    bx.beginPath(); bx.moveTo(pts[0][0],pts[0][1]); bx.lineTo(pts[1][0],pts[1][1]); bx.lineTo(pts[2][0],pts[2][1]); bx.closePath();
    bx.fillStyle=palette[i%palette.length]; bx.fill();
    bx.strokeStyle="#FFFFFF"; bx.lineWidth=2.5; bx.stroke();
  });
  return c;
})();
function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function draw(canvas,g,cfg){
  const ctx=canvas.getContext("2d");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(canvas.width!==W*dpr){canvas.width=W*dpr;canvas.height=H*dpr;}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const C={r1:cssVar("--r1"),r2:cssVar("--r2"),oni:cssVar("--oni"),freeze:cssVar("--freeze")};
  ctx.fillStyle="#F7F7F5";ctx.fillRect(0,0,W,H);
  ctx.drawImage(bgCanvas,0,0);
  // 走行可能ルート（黄色。消失したルートは除く）
  const dropped=new Set(g.dropped||[]);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  EDGES.forEach((e,i)=>{if(dropped.has(i))return;ctx.moveTo(e.pts[0][0],e.pts[0][1]);for(let k=1;k<e.pts.length;k++)ctx.lineTo(e.pts[k][0],e.pts[k][1]);});
  ctx.strokeStyle="rgba(255,204,0,0.45)";ctx.lineWidth=6.5;ctx.stroke();
  // 消失したルート（グレーの点線）
  (g.dropped||[]).forEach(i=>{
    const e=EDGES[i]; ctx.save();ctx.setLineDash([3,7]);ctx.strokeStyle="rgba(120,120,120,0.55)";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(e.pts[0][0],e.pts[0][1]);for(let k=1;k<e.pts.length;k++)ctx.lineTo(e.pts[k][0],e.pts[k][1]);ctx.stroke();ctx.restore();
  });
  ctx.fillStyle="rgba(184,134,11,0.7)";
  Object.keys(NODES).forEach(k=>{const [x,y]=NODES[k];ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();});
  // 導き（自陣営だけが通れない道）
  (g.guides||[]).forEach(gd=>{
    const e=EDGES[gd.e]; const col=gd.side==="o"?C.oni:"#3A66C4";
    ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha=.7;ctx.beginPath();
    ctx.moveTo(e.pts[0][0],e.pts[0][1]);for(let i=1;i<e.pts.length;i++)ctx.lineTo(e.pts[i][0],e.pts[i][1]);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(gd.x,gd.y);ctx.fillStyle="#FFFFFF";ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=col;ctx.font='bold 11px "IBM Plex Mono",monospace';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("導",0,.5);ctx.restore();
  });
  // 検問ポイント（鬼のみ通行止め）
  g.checkpoints.forEach(cp=>{
    const e=EDGES[cp.e];
    ctx.save();ctx.setLineDash([8,6]);ctx.strokeStyle=C.oni;ctx.lineWidth=5;ctx.globalAlpha=.55;ctx.beginPath();
    ctx.moveTo(e.pts[0][0],e.pts[0][1]);for(let i=1;i<e.pts.length;i++)ctx.lineTo(e.pts[i][0],e.pts[i][1]);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(cp.x,cp.y);ctx.fillStyle="#FFFFFF";ctx.strokeStyle=C.oni;ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(-16,-7,32,14);ctx.fill();ctx.stroke();
    ctx.fillStyle=C.oni;for(let i=-16;i<16;i+=8){ctx.beginPath();ctx.moveTo(i,-7);ctx.lineTo(i+4,-7);ctx.lineTo(i-2,7);ctx.lineTo(i-6,7);ctx.closePath();ctx.fill();}
    ctx.font='bold 12px "IBM Plex Mono",monospace';ctx.textAlign="center";ctx.textBaseline="alphabetic";
    const txt="検問 "+Math.ceil(cp.until-g.elapsed)+"s";ctx.lineWidth=4;ctx.strokeStyle="#FFFFFF";ctx.strokeText(txt,0,-13);ctx.fillStyle=C.oni;ctx.fillText(txt,0,-13);
    ctx.restore();
  });

  // 落ちているスキル
  g.items.forEach(it=>{
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.PI/4);
    ctx.fillStyle=it.side==="o"?C.oni:"#FF7EB6";ctx.strokeStyle="#FFFFFF";ctx.lineWidth=2.5;ctx.beginPath();ctx.rect(-11,-11,22,22);ctx.fill();ctx.stroke();ctx.restore();
    ctx.fillStyle="#FFFFFF";ctx.font='bold 12px "IBM Plex Mono",monospace';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ITEM_SHORT[it.kind],it.x,it.y+.5);
  });
  function pin(p,col,label,alpha,frozen,badge,stealth){
    ctx.save();ctx.globalAlpha=alpha;
    if(stealth>0){ctx.globalAlpha=alpha*0.55;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(p[0],p[1],21,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();ctx.setLineDash([]);}
    ctx.beginPath();ctx.arc(p[0],p[1],14,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle="#FFFFFF";ctx.stroke();
    if(frozen>0){ctx.beginPath();ctx.arc(p[0],p[1],21,0,Math.PI*2);ctx.strokeStyle=C.freeze;ctx.lineWidth=3;ctx.stroke();}
    ctx.fillStyle="#FFFFFF";ctx.font='bold 15px "IBM Plex Mono",monospace';ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(label,p[0],p[1]+.5);
    if(frozen>0){
      ctx.font='bold 14px "IBM Plex Mono",monospace';ctx.textBaseline="alphabetic";
      const txt="STOP "+Math.ceil(frozen)+"s";
      ctx.lineWidth=4;ctx.strokeStyle="#FFFFFF";ctx.strokeText(txt,p[0],p[1]-27);
      ctx.fillStyle=C.freeze;ctx.fillText(txt,p[0],p[1]-27);
    }else if(stealth>0){
      ctx.font='bold 14px "IBM Plex Mono",monospace';ctx.textBaseline="alphabetic";const txt="隠密 "+Math.ceil(stealth)+"s";
      ctx.lineWidth=4;ctx.strokeStyle="#FFFFFF";ctx.strokeText(txt,p[0],p[1]-27);ctx.fillStyle=col;ctx.fillText(txt,p[0],p[1]-27);
    }else if(badge){
      ctx.font='bold 14px "IBM Plex Mono",monospace';ctx.textBaseline="alphabetic";
      ctx.lineWidth=4;ctx.strokeStyle="#FFFFFF";ctx.strokeText(badge,p[0],p[1]-27);
      ctx.fillStyle=col;ctx.fillText(badge,p[0],p[1]-27);
    }
    ctx.restore();
  }
  g.dummies.forEach(d=>{ // おとり: 鬼の画面では本物と同じ見た目。走者側（cfg.showDecoy）では「偽」タグ付き
    const dp=posOf(d); pin(dp,d.owner==="r1"?C.r1:C.r2,d.owner==="r1"?"1":"2",1,0,cfg.showDecoy?"偽":null,0);
    if(cfg.showDecoy){ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle="#FFFFFF";ctx.lineWidth=2;ctx.beginPath();ctx.arc(dp[0],dp[1],18,0,Math.PI*2);ctx.stroke();ctx.restore();}
  });
  g.runners.forEach((r,i)=>{if(r.alive)pin(posOf(r),i===0?C.r1:C.r2,String(i+1),1,r.freeze,null,r.stealth);});
  const o=g.oni;
  const forced=oniShown(g);
  const badge=g.boost>0?"BOOST "+Math.ceil(g.boost)+"s":(g.jam>0?"JAM "+Math.ceil(g.jam)+"s":null);
  if(forced) pin(posOf(o),C.oni,"鬼",1,o.freeze,badge);
  else if(cfg.xray) pin(posOf(o),C.oni,"鬼",0.4,0,badge);
}


/* ============ ACTIONS（人でもCPUでも同じ入口） ============ */
function applyAction(g,act){
  const who=act.who, kind=act.kind;
  const runner=who==="r1"?g.runners[0]:who==="r2"?g.runners[1]:null;
  if(runner&&!runner.alive) return false;
  if(kind==="g"){ // 導き: 指定した道を、自陣営（鬼は鬼のみ／走者は走者2人）が10秒間通れなくする。30秒クールダウン
    if(!(typeof act.e==="number"&&EDGES[act.e])) return false;
    if((g.guideReady[who]||0)>g.elapsed) return false;
    g.guides.push({e:act.e,x:act.x,y:act.y,side:who==="oni"?"o":"r",until:g.elapsed+GUIDE});
    if(who==="oni") turnBackIfBefore(g.oni,act.e,act.x,act.y); else [...g.runners,...g.dummies].forEach(r=>turnBackIfBefore(r,act.e,act.x,act.y));
    g.guideReady[who]=g.elapsed+GUIDE_CD; return true;
  }
  const key=who+kind;
  if(!(g.skills[key]>0)) return false;
  if(who==="oni"){
    if(kind==="b"){g.boost=BOOST;}
    else if(kind==="w"){const ks=Object.keys(NODES);const o=g.oni;o.node=ks[Math.floor(Math.random()*ks.length)];o.pe=-1;o.e=null;o.to=null;o.s=0;}
    else if(kind==="j"){g.jam=JAM;}
    else return false;
  }else{
    if(kind==="f"){g.oni.freeze=Math.max(g.oni.freeze,FREEZE);}
    else if(kind==="v"){g.reveal=Math.max(g.reveal,REVEAL);}
    else if(kind==="s"){runner.stealth=Math.max(runner.stealth,STEALTH);}
    else if(kind==="w"){
      const op=posOf(g.oni);const far=Object.keys(NODES).filter(k=>Math.hypot(NODES[k][0]-op[0],NODES[k][1]-op[1])>=80);const pool=far.length?far:Object.keys(NODES);
      runner.node=pool[Math.floor(Math.random()*pool.length)];runner.pe=-1;runner.e=null;runner.to=null;runner.s=0;}
    else if(kind==="c"){ if(!(typeof act.e==="number"&&EDGES[act.e])) return false; g.checkpoints.push({e:act.e,x:act.x,y:act.y,until:g.elapsed+CHECKPOINT}); turnBackIfBefore(g.oni,act.e,act.x,act.y); }
    else if(kind==="d"){ // おとり: マップ上のランダムな交差点（鬼から60px以上）に自分と同じ見た目のダミーを出す（1分）
      const op=posOf(g.oni);const far=Object.keys(NODES).filter(k=>Math.hypot(NODES[k][0]-op[0],NODES[k][1]-op[1])>=60);const pool=far.length?far:Object.keys(NODES);
      const d=makeAgent("d"+g.elapsed.toFixed(1),pool[Math.floor(Math.random()*pool.length)]); Object.assign(d,{owner:who,until:g.elapsed+DECOY});
      g.dummies.push(d); }
    else return false;
  }
  g.skills[key]-=1;
  return true;
}

/* ============ CPU（ホスト側で判断。位置は常に把握している前提） ============ */
function pathDist(from,to,blocked){ // from の現在位置から to の現在位置までの道なり距離
  const D=distFrom(from,blocked||new Set());
  if(to.e==null) return D[to.node];
  const e=EDGES[to.e]; const sA=to.dir===1?to.s:e.len-to.s;
  return Math.min(D[e.a]+sA, D[e.b]+(e.len-sA));
}
function cpuThink(g,roles,cfg){ // roles: CPUが担当する役割の配列。0.5秒ごとに呼ぶ想定
  if(g.over||!g.running) return;
  if(!g.cpuLast) g.cpuLast={};
  const blocked=new Set(g.checkpoints.map(cp=>cp.e).concat(g.dropped||[]));
  const o=g.oni;
  const act=(who,kind,extra)=>{ if(g.elapsed-(g.cpuLast[who]||-99)<1.5) return false; const ok=applyAction(g,Object.assign({who,kind},extra||{})); if(ok) g.cpuLast[who]=g.elapsed; return ok; };
  roles.forEach(role=>{
    if(role==="oni"){
      const targets=g.runners.filter(r=>r.alive&&r.stealth<=0); if(!targets.length) return;
      let dt=Infinity; targets.forEach(r=>{dt=Math.min(dt,pathDist(o,r,blocked));});
      if(o.freeze>0) return;
      if(dt<150&&dt>25&&g.boost<=0&&act("oni","b")) return;
      if(dt<220&&g.jam<=0&&g.ping>=PING_CYCLE-PING_SHOW-1.5&&g.ping<PING_CYCLE-PING_SHOW&&act("oni","j")) return;
      if(dt>380&&g.elapsed>20&&Math.random()<0.3&&act("oni","w")) return;
      return;
    }
    const r=role==="r1"?g.runners[0]:g.runners[1]; if(!r.alive) return;
    const d=pathDist(r,o,blocked);
    const oniActive=o.freeze<=0;
    if(oniActive&&d<45&&r.stealth<=0&&act(role,"s")) return;     // 接触寸前: 隠密ですれ違う
    if(oniActive&&d<80&&r.stealth<=0&&act(role,"f")) return;     // 近い: 凍結
    if(oniActive&&d<130&&!g.dummies.some(x=>x.owner===role)&&act(role,"d")) return; // 迫られたら、おとりを置いて分岐で散らす
    if(oniActive&&d<40&&r.stealth<=0&&act(role,"w")) return;     // 最後の手段: ワープ
    if(oniActive&&d<170&&g.skills[role+"c"]>0){
      // 鬼が自分へ向かう最短経路の「次の道」を封鎖する（鬼が道の途中なら、その先の交差点から）
      const D=distFrom(r,blocked); const from=o.e!=null?o.to:o.node; let best=null,bd=Infinity;
      ADJ[from].forEach(op=>{if(blocked.has(op.e)||op.e===o.e)return;const dd=EDGES[op.e].len+D[op.to];if(dd<bd){bd=dd;best=op;}});
      if(best){const e=EDGES[best.e];const m=pointAt(e,e.len/2);if(act(role,"c",{e:best.e,x:Math.round(m[0]),y:Math.round(m[1])}))return;}
    }
    if(g.phaseN>=3&&d<220&&g.jam<=0&&g.reveal<=0&&act(role,"v")) return;
  });
}

function levelLabel(g){const n=g?phaseOf(g.elapsed).n:1;return "鬼：レベル"+(n>=PHASES.length?"MAX":n);}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function strip(g){ // Firebaseはundefined/nullの扱いが面倒なので素直にJSON化
  return JSON.parse(JSON.stringify(g,(k,v)=>v===undefined?null:v));
}
function hydrate(s){ // 保存された状態を復元（配列やnullが落ちる場合に備える）
  if(!s) return null;
  const g=newGame();
  Object.assign(g,s);
  const rs=Array.isArray(s.runners)?s.runners:Object.values(s.runners||{});
  const n0=Object.keys(NODES)[0];
  g.runners=rs.map((r,i)=>Object.assign(makeAgent("r"+(i+1),n0),r));
  if(g.runners.length<2){const fresh=newGame().runners;while(g.runners.length<2)g.runners.push(fresh[g.runners.length]);}
  g.oni=Object.assign(makeAgent("oni",n0),s.oni||{});
  g.checkpoints=Array.isArray(s.checkpoints)?s.checkpoints:Object.values(s.checkpoints||{});
  g.items=Array.isArray(s.items)?s.items:Object.values(s.items||{});
  g.dummies=(Array.isArray(s.dummies)?s.dummies:Object.values(s.dummies||{})).map(d=>Object.assign(makeAgent("d",n0),d));
  g.guides=Array.isArray(s.guides)?s.guides:Object.values(s.guides||{});
  g.dropped=Array.isArray(s.dropped)?s.dropped:Object.values(s.dropped||{});
  g.dropCount=s.dropCount||0;
  g.guideReady=Object.assign({r1:0,r2:0,oni:0},s.guideReady||{});
  g.skills=Object.assign(newGame().skills,s.skills||{});
  [g.oni,...g.runners,...g.dummies].forEach(a=>{ if(a.e===undefined||a.e===null) a.e=null; if(a.to===undefined) a.to=null; if(a.pe===undefined) a.pe=-1; if(!a.stealth) a.stealth=0; if(!a.freeze) a.freeze=0; });
  ["jam","reveal","boost","catchFlash"].forEach(k=>{ if(!g[k]) g[k]=0; });
  return g;
}

  const [tick,setTick]=useState(0);

  const canvasRef=useRef(null);
  const hostLoopRef=useRef(null);
  const appliedRef=useRef(new Set());

  const isHost=room&&room.hostId===ME;
  const myRole=room&&room.roles?room.roles[ME]:null;
  const players=room&&room.players?Object.entries(room.players).map(([id,p])=>({id,...p})).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)):[];

  /* ---- 部屋の購読 ---- */
  useEffect(()=>{
    if(!db||!roomCode) return;
    const ref=db.ref("rooms/"+roomCode);
    const cb=ref.on("value",snap=>{
      const r=snap.val();
      if(!r){setErr("部屋が閉じられました");setRoom(null);setRoomCode(null);setScreen("home");return;}
      setRoom(r);
      if(r.status==="lobby") setScreen("lobby");
      else setScreen("game");
      if(r.hostId!==ME&&r.state){ gRef.current=hydrate(r.state); }
    });
    return()=>{ref.off("value",cb);};
  },[roomCode]);

  /* ---- 在席管理: ロビー中だけ切断時に自分を消す。再接続したら戻す ---- */
  useEffect(()=>{
    if(!db||!roomCode||!room) return;
    const meRef=db.ref("rooms/"+roomCode+"/players/"+ME);
    if(room.status==="lobby"){ meRef.onDisconnect().remove(); } else { meRef.onDisconnect().cancel(); }
    const conn=db.ref(".info/connected");
    const cb=conn.on("value",s=>{
      if(s.val()===true&&room.status==="lobby"&&!(room.players&&room.players[ME])&&Object.keys(room.players||{}).length<3){
        meRef.set({name:name.trim()||"?",ready:false,joinedAt:firebase.database.ServerValue.TIMESTAMP});
      }
    });
    return()=>{conn.off("value",cb);};
  },[roomCode,room&&room.status,room&&!!(room.players&&room.players[ME])]);

  /* ---- 全員準備完了で自動スタート（ホストが判定） ---- */
  useEffect(()=>{
    if(!isHost||!room||room.status!=="lobby") return;
    const need=room.size||3;
    if(players.length===need&&players.every(p=>p.ready)){
      const ids=shuffle(players.map(p=>p.id));
      const pool=shuffle(["r1","r2","oni"]); // 完全ランダム（Fisher-Yates）
      const roles={}; ids.forEach((id,i)=>roles[id]=pool[i]); // 2人のときは余った役割がCPU
      const g=newGame(); g.running=true; gRef.current=g; appliedRef.current=new Set();
      db.ref("rooms/"+roomCode).update({status:"playing",roles,startedAt:firebase.database.ServerValue.TIMESTAMP,state:strip(g),actions:null});
      players.forEach(p=>db.ref("rooms/"+roomCode+"/players/"+p.id).onDisconnect().cancel());
    }
  },[isHost,room&&room.status,JSON.stringify(players.map(p=>[p.id,p.ready])),room&&room.size]);

  /* ---- ホスト: シミュレーション本体と状態配信 ---- */
  useEffect(()=>{
    if(!isHost||!room||room.status!=="playing") return;
    if(!gRef.current) gRef.current=hydrate(room.state)||newGame();
    const g=gRef.current; g.running=!g.over;
    const cfg={oniSpeed:room.oniSpeed||1.4,evade:true};
    const actRef=db.ref("rooms/"+roomCode+"/actions");
    const onAct=actRef.on("child_added",snap=>{
      if(appliedRef.current.has(snap.key)) return; appliedRef.current.add(snap.key);
      const a=snap.val(); if(a&&gRef.current&&!gRef.current.over) applyAction(gRef.current,a);
      snap.ref.remove();
    });
    const cpuRoles=["r1","r2","oni"].filter(r=>!Object.values(room.roles||{}).includes(r));
    let raf,last=performance.now(),acc=0,cpuAcc=0,alive=true;
    const loop=(now)=>{
      if(!alive) return;
      const g=gRef.current; const real=Math.min(0.1,(now-last)/1000);last=now;
      let dt=real; while(dt>0){const d=Math.min(0.05,dt);stepGame(g,d,cfg);dt-=d;}
      cpuAcc+=real; if(cpuAcc>=0.5&&cpuRoles.length){cpuAcc=0;cpuThink(g,cpuRoles,cfg);}
      acc+=real;
      if(acc>=0.1){acc=0;db.ref("rooms/"+roomCode+"/state").set(strip(g));if(g.over){db.ref("rooms/"+roomCode).update({status:"over"});}}
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return()=>{alive=false;cancelAnimationFrame(raf);actRef.off("child_added",onAct);};
  },[isHost,room&&room.status,roomCode]);

  /* ---- 描画ループ（全員） ---- */
  useEffect(()=>{
    let raf,acc=0,last=performance.now();
    const loop=(now)=>{
      const real=(now-last)/1000;last=now;acc+=real;
      const g=gRef.current;
      if(g&&canvasRef.current&&screen==="game") draw(canvasRef.current,g,{xray:myRole==="oni",showDecoy:myRole!=="oni"});
      if(acc>=0.1){acc=0;setTick(t=>t+1);}
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[screen,myRole]);

  /* ---- 操作 ---- */
  const saveName=()=>{try{localStorage.setItem("tag_name",name);}catch(e){}};
  const createRoom=async()=>{
    if(!db)return; if(!name.trim()){setErr("名前を入れてください");return;} saveName(); setErr(null);
    const code=makeCode();
    await db.ref("rooms/"+code).set({createdAt:firebase.database.ServerValue.TIMESTAMP,hostId:ME,status:"lobby",oniSpeed:1.4,size:3,
      players:{[ME]:{name:name.trim(),ready:false,joinedAt:firebase.database.ServerValue.TIMESTAMP}}});
    setRoomCode(code);
  };
  const joinRoom=async()=>{
    if(!db)return; const code=codeIn.trim(); if(!name.trim()){setErr("名前を入れてください");return;} if(!/^\d{3}$/.test(code)){setErr("3桁の部屋番号を入れてください");return;}
    saveName(); setErr(null);
    const snap=await db.ref("rooms/"+code).get(); const r=snap.val();
    if(!r){setErr("その部屋はありません");return;}
    const n=Object.keys(r.players||{}).length;
    if(!(r.players&&r.players[ME])){ if(r.status!=="lobby"){setErr("この部屋はもう始まっています");return;} if(n>=(r.size||3)){setErr("この部屋は満員です（"+(r.size||3)+"人）");return;} }
    await db.ref("rooms/"+code+"/players/"+ME).update({name:name.trim(),ready:false,joinedAt:firebase.database.ServerValue.TIMESTAMP});
    setRoomCode(code);
  };
  const toggleReady=()=>{ if(!room||!room.players[ME])return; db.ref("rooms/"+roomCode+"/players/"+ME+"/ready").set(!room.players[ME].ready); };
  const leaveRoom=async()=>{ if(!roomCode)return; if(isHost) await db.ref("rooms/"+roomCode).remove(); else await db.ref("rooms/"+roomCode+"/players/"+ME).remove(); setRoomCode(null);setRoom(null);setScreen("home");gRef.current=null; };
  const backToLobby=async()=>{ if(!isHost)return; const upd={status:"lobby",roles:null,state:null,actions:null}; players.forEach(p=>upd["players/"+p.id+"/ready"]=false); await db.ref("rooms/"+roomCode).update(upd); gRef.current=null; };
  const sendAction=(kind,extra)=>{ if(!myRole||!room||room.status!=="playing")return; db.ref("rooms/"+roomCode+"/actions").push({who:myRole,kind,...(extra||{}),at:firebase.database.ServerValue.TIMESTAMP}); };
  const onBoardClick=(ev)=>{
    if(!placing)return; const rect=ev.currentTarget.getBoundingClientRect();
    const x=(ev.clientX-rect.left)/rect.width*W, y=(ev.clientY-rect.top)/rect.height*H;
    const ne=nearestEdge(x,y); if(!ne)return; sendAction(placing==="g"?"g":"c",{e:ne.e,x:Math.round(ne.x),y:Math.round(ne.y)}); setPlacing(false);
  };

  /* ---- 画面 ---- */
  const title=h("div",{className:"title"},h("h1",null,"Chase Girls"),h("span",{className:"sub"},roomCode?"部屋 "+roomCode+(isHost?"（ホスト）":""):"鬼 1 vs 走者 2 ・ 05:00"));

  if(screen==="home"){
    return h(React.Fragment,null,title,
      h("div",{className:"card"},
        h("h2",null,"あなたの名前"),
        h("input",{type:"text",value:name,maxLength:12,placeholder:"例: タツヒロ",onChange:e=>setName(e.target.value)}),
        err?h("div",{className:"err"},err):null),
      h("div",{className:"card"},
        h("h2",null,"部屋を作る"),
        h("button",{className:"big on",onClick:createRoom,disabled:!db},"新しい部屋を作る"),
        h("p",{className:"note"},"3桁の部屋番号が出るので、友達に伝えてください。人数（1〜3人）がそろって全員が準備完了になると自動で始まります。役割（鬼・走者1・走者2）はランダムで、足りない役はCPUが担当します（1人でも遊べます）。")),
      h("div",{className:"card"},
        h("h2",null,"部屋に入る"),
        h("div",{style:{display:"flex",gap:8}},
          h("input",{type:"text",inputMode:"numeric",pattern:"[0-9]*",value:codeIn,maxLength:3,placeholder:"部屋番号（3桁）",style:{flex:1,letterSpacing:".2em"},onChange:e=>setCodeIn(e.target.value.replace(/[^0-9]/g,""))}),
          h("button",{className:"big",onClick:joinRoom,disabled:!db},"入る"))));
  }

  if(screen==="lobby"){
    const me=room.players&&room.players[ME];
    return h(React.Fragment,null,title,
      h("div",{className:"card",style:{alignItems:"center"}},
        h("h2",null,"部屋番号"),h("div",{className:"code mono"},roomCode),
        h("button",{onClick:copyCode},copied?"コピーしました":"番号をコピー"),
        h("p",{className:"note"},"この番号を友達に伝えてください（"+(room.size||3)+"人で遊びます）")),
      h("div",{className:"card"},
        h("h2",null,"メンバー "+players.length+"/"+(room.size||3)),
        h("div",{className:"players"},players.map(p=>h("div",{className:"player",key:p.id},
          h("span",{className:"nm"},p.name+(p.id===ME?"（あなた）":"")+(p.id===room.hostId?" ★":"")),
          h("span",{className:"st"+(p.ready?" ok":"")},p.ready?"READY":"WAITING")))),
        me?h("button",{className:"big"+(me.ready?" on":""),onClick:toggleReady},me.ready?"準備完了（取り消す）":"準備完了"):null,
        players.length<(room.size||3)?h("p",{className:"note"},"あと"+((room.size||3)-players.length)+"人待っています"):h("p",{className:"note"},"全員が準備完了になると自動で始まります")),

        h("h2",null,"鬼の速度（ホスト設定）"),
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("input",{type:"range",min:1,max:2,step:0.1,value:room.oniSpeed||1.4,onChange:e=>db.ref("rooms/"+roomCode+"/oniSpeed").set(parseFloat(e.target.value))}),
          h("span",{className:"mono"},(room.oniSpeed||1.4).toFixed(1)+"x"))):null,

  }

  // game
  const g=gRef.current;
  const showRole=!!(g&&g.elapsed<4&&!g.over);
  const ph=g?phaseOf(g.elapsed):{n:1,p:.55};
  const remain=g?TOTAL-g.elapsed:TOTAL;
  const alive=g?g.runners.filter(r=>r.alive).length:2;
  const final=g&&g.elapsed>0&&remain<=FINAL_REVEAL;
  const nextPing=g?(g.oniVisible?0:(PING_CYCLE-PING_SHOW)-g.ping):0;
  const sk=g?g.skills:newGame().skills;
  const canAct=g&&!g.over&&room.status==="playing"&&!showRole;
  const myRunner=g&&(myRole==="r1"?g.runners[0]:myRole==="r2"?g.runners[1]:null);
  const cell=(k,v,extra,cls)=>h("div",{className:"cell"+(cls?" "+cls:"")},h("div",{className:"k"},k),h("div",{className:"v mono"},v,extra?h("small",null,extra):null));
  const guideBtn=(who,dead)=>{const cd=g?Math.max(0,(g.guideReady&&g.guideReady[who]||0)-g.elapsed):0;
    return h("button",{className:"skill "+who+(placing==="g"?" on":""),disabled:cd>0||!canAct||dead,onClick:()=>setPlacing(p=>p==="g"?false:"g")},Icon.guide,cd>0?"導き "+Math.ceil(cd)+"s":"導き");};
  let skillRow=null;
  if(myRole==="oni"){
    skillRow=h("div",{className:"row"},h("span",{className:"lbl"},"鬼のスキル（各1回）"),
      h("button",{className:"skill oni",disabled:!(sk.onib>0)||!canAct,onClick:()=>sendAction("b")},Icon.bolt,"走力ブースト 1.5倍"),
      h("button",{className:"skill oni",disabled:!(sk.oniw>0)||!canAct,onClick:()=>sendAction("w")},Icon.warp,"ランダムワープ"),
      h("button",{className:"skill oni",disabled:!(sk.onij>0)||!canAct,onClick:()=>sendAction("j")},Icon.jam,"ジャミング "+JAM+"秒"),
      guideBtn("oni"));
  }else if(myRole){
    const r=myRole, dead=myRunner&&!myRunner.alive;
    skillRow=h("div",{className:"row"},h("span",{className:"lbl"},ROLE_LABEL[r]+"のスキル"+(dead?"（確保されました）":"")),
      h("button",{className:"skill "+r,disabled:!(sk[r+"f"]>0)||!canAct||dead,onClick:()=>sendAction("f")},Icon.snow,"凍結 ×"+(sk[r+"f"]||0)),
      h("button",{className:"skill "+r,disabled:!(sk[r+"v"]>0)||!canAct||dead,onClick:()=>sendAction("v")},Icon.eye,"鬼を表示 ×"+(sk[r+"v"]||0)),
      h("button",{className:"skill "+r,disabled:!(sk[r+"w"]>0)||!canAct||dead,onClick:()=>sendAction("w")},Icon.warp,"ワープ ×"+(sk[r+"w"]||0)),
      h("button",{className:"skill "+r,disabled:!(sk[r+"s"]>0)||!canAct||dead||(myRunner&&myRunner.stealth>0),onClick:()=>sendAction("s")},Icon.ghost,"隠密 ×"+(sk[r+"s"]||0)),
      h("button",{className:"skill "+r+(placing==="c"?" on":""),disabled:!(sk[r+"c"]>0)||!canAct||dead,onClick:()=>setPlacing(p=>p==="c"?false:"c")},Icon.block,"検問 ×"+(sk[r+"c"]||0)),
      h("button",{className:"skill "+r,disabled:!(sk[r+"d"]>0)||!canAct||dead,onClick:()=>sendAction("d")},Icon.decoy,"おとり ×"+(sk[r+"d"]||0)),
      guideBtn(r,dead));
  }
  const otherChips=(()=>{
    if(myRole==="oni") return ["r1","r2"].map(o=>h(SkillChips,{key:o,who:o,sk,label:ROLE_LABEL[o],dead:g&&!(o==="r1"?g.runners[0]:g.runners[1]).alive}));
    if(myRole){const o=myRole==="r1"?"r2":"r1";return h(SkillChips,{who:o,sk,label:ROLE_LABEL[o],dead:g&&!(o==="r1"?g.runners[0]:g.runners[1]).alive});}
    return null;
  })();
  return h(React.Fragment,null,title,
    h("div",{className:"status"},
      cell("Time",fmt(remain),null,remain<=60&&!(g&&g.over)?"alert":""),
      cell("Runners",alive+"/2",null,alive<2?"alert":""),
      cell("Oni Lv",ph.n>=PHASES.length?"MAX":String(ph.n),Math.round(ph.p*100)+"% / x"+speedMul(ph.n).toFixed(2)),
      cell("Ping",final?"FINAL":g&&g.jam>0?"JAM":g&&g.reveal>0?"REVEAL":g&&g.oniVisible?"PING":Math.ceil(nextPing)+"s",g&&g.jam>0?Math.ceil(g.jam)+"s":g&&g.reveal>0?Math.ceil(g.reveal)+"s":null,(g&&g.jam<=0&&(g.oniVisible||g.reveal>0))||final?"alert":"")),
    h("div",{className:"board"},
      h("canvas",{ref:canvasRef,width:W,height:H,style:{aspectRatio:W+"/"+H,cursor:placing?"crosshair":"default"},onClick:onBoardClick}),
      g&&g.toast?h("div",{className:"toast"+(g.toast.big?" max":"")+(g.toast.small?" small":""),key:g.toast.text+g.toast.sub},h("div",{className:"t1"},g.toast.text)):null,
      h("div",{className:"lvl"},levelLabel(g)),
      placing?h("div",{className:"hint"},placing==="g"?"「導き」で封鎖する道路をタップ（"+(myRole==="oni"?"鬼だけ":"走者2人だけ")+"が10秒通れない）":"検問を置く道路をタップ（鬼のみ10秒通行止め）",h("button",{onClick:()=>setPlacing(false),style:{marginLeft:10,padding:"2px 8px"}},"やめる")):null,
      showRole&&myRole?h("div",{className:"overlay"},
        h("div",{className:"small"},"あなたの役割"),
        h("div",{className:"huge"},h("span",{className:"role "+myRole},ROLE_LABEL[myRole])),
        h("div",{className:"small"},myRole==="oni"?"あなたの画面では鬼の位置が常に見えます。走者2人を5分以内に確保しよう。":"5分逃げ切れば勝ち。鬼は10秒に2秒だけ映ります。道に落ちているスキルを拾うと使用回数が増えます。")):null,
      g&&g.over?h("div",{className:"overlay"},
        h("div",{className:"big mono"},g.over==="ONI"?"鬼の勝利":"走者の勝利"),
        h("div",{className:"small"},(g.over==="ONI"?"全走者を確保 ・ 残り "+fmt(remain):"5分逃げ切り ・ 生存 "+alive+"/2")+(myRole?" ／ あなた: "+ROLE_LABEL[myRole]:"")),
        isHost?h("button",{className:"big on",onClick:backToLobby,style:{marginTop:8}},"ロビーに戻る"):h("p",{className:"note"},"ホストがロビーに戻すのを待っています"),
        h("button",{onClick:leaveRoom},"退室")):null,
      !g?h("div",{className:"overlay"},h("div",{className:"big mono"},"接続中…")):null),
    h("div",{className:"panel"},otherChips,skillRow),
    h("p",{className:"note"},"あなた: ",myRole?h("span",{className:"role "+myRole},ROLE_LABEL[myRole]):"—"," ／ ",players.map(p=>p.name+"="+(room.roles&&room.roles[p.id]?ROLE_LABEL[room.roles[p.id]]:"?")).concat(["r1","r2","oni"].filter(r=>!Object.values(room.roles||{}).includes(r)).map(r=>"CPU="+ROLE_LABEL[r])).join("、")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
